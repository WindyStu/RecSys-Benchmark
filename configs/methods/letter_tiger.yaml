method_id: letter_tiger
display_name: LETTER-TIGER
method_type: ranker
status: adapter-ready
source: baselines/letter/LETTER-TIGER
adapter: recsys_benchmark.adapters.letter.LetterAdapter
supported_tasks: [sdsr]
supported_eval_inputs: [topk]
paper: "Learnable Item Tokenization for Generative Recommendation"
commands:
  train: ["torchrun", "--nproc_per_node", "{method.defaults.num_gpus}", "--master_port", "{method.defaults.master_port}", "finetune.py", "--base_model", "{method.defaults.base_model}", "--output_dir", "{output_dir}/native/ckpt", "--dataset", "{dataset.dataset_id}", "--data_path", "{dataset.path_root}", "--per_device_batch_size", "{method.defaults.batch_size}", "--learning_rate", "{method.defaults.learning_rate}", "--epochs", "{method.defaults.epochs}", "--index_file", "{method.defaults.index_file}", "--temperature", "1.0", "--seed", "{seed}"]
  predict: ["python", "test.py", "--gpu_id", "{method.defaults.gpu_id}", "--ckpt_path", "{output_dir}/native/ckpt", "--dataset", "{dataset.dataset_id}", "--data_path", "{dataset.path_root}", "--results_file", "{output_dir}/native/results.json", "--test_batch_size", "{method.defaults.test_batch_size}", "--num_beams", "{method.defaults.num_beams}", "--test_prompt_ids", "0", "--index_file", "{method.defaults.index_file}", "--metrics", "hit@1,hit@5,hit@10,ndcg@5,ndcg@10", "--seed", "{seed}"]
native_metrics:
  type: letter_result_json
  log_dir: "{output_dir}/native"
  pattern: results.json
defaults:
  base_model: REPLACE_WITH_T5_BASE_MODEL
  num_gpus: 1
  master_port: 29501
  gpu_id: 0
  batch_size: 256
  test_batch_size: 32
  learning_rate: 5e-4
  epochs: 200
  num_beams: 20
  index_file: .index.json
notes: Training, explicit test generation, and native result collection are wired. Override base_model and validate on the server before marking runnable.
