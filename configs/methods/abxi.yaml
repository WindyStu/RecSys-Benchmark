method_id: abxi
display_name: ABXI
method_type: ranker
status: adapter-ready
source: baselines/abxi
adapter: recsys_benchmark.adapters.abxi.ABXIAdapter
supported_tasks: [cdsr]
supported_eval_inputs: [candidate_scores, topk]
paper: "ABXI: Invariant Interest Adaptation for Task-Guided Cross-Domain Sequential Recommendation"
commands:
  prepare: ["python", "../../scripts/prepare_cdsr_sequence.py", "--source-dir", "{dataset.path}", "--target-root", "data", "--dataset", "{dataset.dataset_id}", "--len-max", "{method.defaults.len_max}"]
  train: ["python", "main.py", "--data", "{dataset.dataset_id}", "--data_root", "data", "--len_max", "{method.defaults.len_max}", "--cuda", "{method.defaults.cuda}", "--seed", "{seed}"]
native_metrics:
  type: dual_domain_log
  log_dir: "{method.source}/log"
  pattern: "{dataset.dataset_id}-*-abxi.log"
defaults:
  len_max: 50
  cuda: "0"
notes: Processed CDSR bridging, training, and dual-domain native metric collection are wired. Server validation is still required.
