method_id: sasrec
display_name: SASRec
method_type: ranker
status: adapter-ready
source: baselines/sasrec_bert4rec_st_loo
adapter: recsys_benchmark.adapters.sasrec_bert4rec.SASRecBERT4RecAdapter
supported_tasks: [sdsr, cdsr]
supported_eval_inputs: [candidate_scores, topk]
paper: "Self-Attentive Sequential Recommendation"
commands:
  prepare: ["python", "scripts/prepare_sdsr_data.py", "single", "--source-root", "{dataset.path_root}", "--target-root", "data", "--domain", "{dataset.dataset_id}", "--out-name", "{dataset.native_ids.sasrec_family}", "--len-max", "{method.defaults.len_max}"]
  train: ["python", "main_st.py", "--m", "sasrec", "--data", "{dataset.native_ids.sasrec_family}", "--raw", "--len_max", "{method.defaults.len_max}", "--cuda", "{method.defaults.cuda}", "--seed", "{seed}", "--eval_mode", "{evaluation.protocol}"]
native_metrics:
  type: sasrec_st_log
  log_dir: "{method.source}/log"
  pattern: "sasrec-st-{dataset.native_ids.sasrec_family}-*.log"
defaults:
  len_max: 50
  cuda: "0"
notes: Prepare, train, and native metric collection are wired. Server/GPU validation is still required before marking runnable.
