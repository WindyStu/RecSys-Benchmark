method_id: eager
display_name: EAGER
method_type: ranker
status: source-integrated
source: baselines/eager
adapter: recsys_benchmark.adapters.eager.EAGERAdapter
supported_tasks: [sdsr]
supported_eval_inputs: [topk]
paper: "EAGER: Two-Stream Generative Recommender with Behavior-Semantic Collaboration"
commands:
