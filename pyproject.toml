[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-benchmark"
version = "0.1.0"
description = "A unified benchmark wrapper for single-domain and cross-domain sequential recommendation baselines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
recsys-benchmark = "recsys_benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["recsys_benchmark*"]
